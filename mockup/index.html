<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Processos e Sub processos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 text-gray-800 flex h-screen">
    <!-- Lateral Sidebar Navigation -->
    <nav class="w-64 bg-white shadow-lg h-full flex flex-col flex-shrink-0">
        <div class="p-6 border-b border-gray-200">
            <div class="font-bold text-xl text-blue-900">Portal Qualidade Mockup</div>
        </div>
        <div class="flex-1 overflow-y-auto py-4 flex flex-col gap-2 px-4">
            <button class="text-left w-full px-4 py-2 text-blue-600 hover:bg-blue-50 font-semibold rounded" onclick="navigateTo('I1')">Processos</button>
            <button class="text-left w-full px-4 py-2 text-blue-600 hover:bg-blue-50 font-semibold rounded" onclick="navigateTo('I5')">Sub Processos</button>
            <button class="text-left w-full px-4 py-2 text-blue-600 hover:bg-blue-50 font-semibold rounded" onclick="navigateTo('I9')">Documentos</button>
        </div>

        <div class="p-4 border-t border-gray-200 mt-auto">
            <button class="w-full bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-2 px-4 rounded text-sm" onclick="toggleInterfaceTags()">
                Mostrar/Esconder Códigos
            </button>
        </div>
    </nav>

    <!-- Main Content Area -->
    <div class="flex-1 overflow-y-auto p-8">
        <div class="max-w-7xl mx-auto bg-white p-6 rounded shadow" id="app">
            <!-- Render target for app.js -->
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
