<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Processos e Sub processos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 text-gray-800 flex h-screen overflow-hidden">
    <!-- Navegação de Mockup para Testes -->
    <aside class="w-64 bg-white shadow-md flex flex-col h-full z-10 border-r border-gray-200">
        <div class="p-6 border-b border-gray-200">
            <div class="font-bold text-xl text-blue-900 leading-tight">Portal Qualidade Mockup</div>
        </div>
        <div class="flex-1 overflow-y-auto p-4 flex flex-col space-y-4">
            <div>
                <h3 class="text-xs uppercase text-gray-500 font-bold mb-2">Ativos</h3>
                <button class="block w-full text-left text-blue-600 font-semibold hover:bg-blue-50 px-3 py-2 rounded" onclick="navigateTo('I1')">Processos</button>
                <button class="block w-full text-left text-blue-600 font-semibold hover:bg-blue-50 px-3 py-2 rounded" onclick="navigateTo('I5')">Sub Processos</button>
                <button class="block w-full text-left text-blue-600 font-semibold hover:bg-blue-50 px-3 py-2 rounded" onclick="navigateTo('I9')">Documentos</button>
            </div>
            <div>
                <h3 class="text-xs uppercase text-gray-500 font-bold mb-2">Rascunhos</h3>
                <button class="block w-full text-left text-orange-600 font-semibold hover:bg-orange-50 px-3 py-2 rounded" onclick="navigateTo('I16')">Processos (Rascunho)</button>
                <button class="block w-full text-left text-orange-600 font-semibold hover:bg-orange-50 px-3 py-2 rounded" onclick="navigateTo('I17')">Sub Processos (Rascunho)</button>
                <button class="block w-full text-left text-orange-600 font-semibold hover:bg-orange-50 px-3 py-2 rounded" onclick="navigateTo('I18')">Documentos (Rascunho)</button>
            </div>
        </div>
    </aside>

    <main class="flex-1 p-8 overflow-y-auto w-full relative" id="app">
        <!-- Render target for app.js -->
    </main>
    <script src="app.js"></script>
</body>
</html>
